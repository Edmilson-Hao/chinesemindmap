<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="SinoGraph Pro — Mapas mentais de vocabulário mandarim com grafo interativo multi-chunk">
  <title>SinoGraph Pro</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <!-- D3.js for force-directed graph -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <!-- HEADER -->
  <header class="app-header">
    <div class="flex items-center gap-2">
      <div class="brand-icon">◈</div>
      <h1>SinoGraph Pro</h1>
    </div>

    <div class="chunk-select-wrap">
      <select id="chunkSelect" onchange="onChunkSelectChange(this.value)" aria-label="Selecionar chunk">
        <option value="GLOBAL">🌐 Todos os Chunks</option>
      </select>
    </div>

    <div class="header-actions">
      <button id="togglePinyinBtn" class="btn-icon" onclick="toggleRecall('pinyin')" title="Ocultar/mostrar Pinyin">拼</button>
      <button id="toggleTransBtn" class="btn-icon" onclick="toggleRecall('trans')" title="Ocultar/mostrar Tradução">译</button>
      <div style="position:relative">
        <button id="dataMenuBtn" class="btn-icon" onclick="toggleDataMenu()" title="Dados">⋮</button>
        <div id="dataMenu" class="hidden" style="position:absolute;right:0;top:44px;width:200px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:6px;z-index:50;box-shadow:0 12px 32px rgba(0,0,0,0.5)">
          <button class="btn btn-outline btn-sm w-full" style="justify-content:flex-start;margin-bottom:4px" onclick="exportDataJSON()">↓ Exportar JSON</button>
          <label class="btn btn-outline btn-sm w-full" style="justify-content:flex-start;margin-bottom:4px;cursor:pointer">
            ↑ Importar JSON
            <input type="file" accept=".json" onchange="importDataJSON(event)" style="display:none">
          </label>
          <button class="btn btn-outline btn-sm w-full" style="justify-content:flex-start;color:var(--danger);border-color:var(--danger)" onclick="resetToDefaultData()">↺ Resetar</button>
        </div>
      </div>
    </div>
  </header>

  <!-- TABS -->
  <nav class="tabs-nav">
    <button id="tabGraphBtn" class="tab-btn active" onclick="switchMainTab('graph')">Mapa / Grafo</button>
    <button id="tabTableBtn" class="tab-btn" onclick="switchMainTab('table')">Vocabulário</button>
  </nav>

  <!-- MAIN -->
  <main class="main-content">

    <!-- GRAPH VIEW -->
    <div id="graphView" class="view active">
      <div class="graph-layout">
        <div class="graph-workspace" id="graphContainer">
          <div class="graph-toolbar">
            <button class="btn-icon" onclick="zoomGraph(1.25)" title="Zoom +">＋</button>
            <button class="btn-icon" onclick="zoomGraph(0.8)" title="Zoom −">−</button>
            <button class="btn-icon" onclick="resetGraphZoom()" title="Centralizar">⊙</button>
            <button class="btn-icon" style="background:var(--accent);color:#0f172a;border-color:var(--accent)" onclick="openNewNodeModal()" title="Novo vocábulo">＋</button>
          </div>
          <div class="graph-legend">
            <span><span class="legend-dot" style="background:#f59e0b"></span> Raiz</span>
            <span><span class="legend-dot" style="background:#0ea5e9"></span> Termo</span>
            <span><span class="legend-dot" style="background:#22c55e;border:1.5px dashed #22c55e"></span> Inter-Chunk</span>
          </div>
          <svg id="d3GraphSvg"></svg>
        </div>

        <aside class="sidebar" id="nodeDetailSidebar">
          <div class="sidebar-header">
            <span style="font-weight:600;font-size:0.9rem">Inspeção</span>
            <span id="sidebarChunkTag" class="badge-muted badge">Nenhum nó</span>
          </div>
          <div id="sidebarBody" class="sidebar-body">
            <div class="empty-state">
              <div class="icon">👆</div>
              <p>Clique em qualquer palavra no mapa para explorar pronúncia, conexões e frases.</p>
            </div>
          </div>
        </aside>
      </div>
    </div>

    <!-- TABLE VIEW -->
    <div id="tableView" class="view">
      <div class="table-view-inner">
        <div class="filter-bar">
          <div class="search-wrap">
            <span class="search-icon">⌕</span>
            <input type="search" id="tableSearchInput" class="input" placeholder="Buscar Hanzi, Pinyin, Tradução..." oninput="renderTable()">
          </div>
          <select id="tableChunkFilter" class="select" style="max-width:180px" onchange="renderTable()">
            <option value="ALL">Todos os Chunks</option>
          </select>
          <button class="btn btn-primary btn-sm" onclick="openNewChunkModal()">+ Tema</button>
          <button class="btn btn-outline btn-sm" onclick="openNewNodeModal()">+ Vocábulo</button>
        </div>

        <div class="vocab-table-wrap">
          <div style="overflow-x:auto">
            <table class="vocab-table">
              <thead>
                <tr>
                  <th>Hanzi</th>
                  <th>Pinyin</th>
                  <th>Tradução</th>
                  <th>Chunk</th>
                  <th>Inter?</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="vocabTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- TOAST -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- MODAL: NEW CHUNK -->
  <div id="newChunkModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3>Novo Tema (Chunk)</h3>
        <button class="btn-icon" onclick="closeModal('newChunkModal')">✕</button>
      </div>
      <div class="form-group">
        <label class="label" for="newChunkName">Título do tema</label>
        <input type="text" id="newChunkName" class="input" placeholder="ex: 商务汉语 - Negócios">
      </div>
      <div class="form-group">
        <label class="label" for="newChunkColor">Cor identificadora</label>
        <input type="color" id="newChunkColor" value="#f59e0b" style="width:100%;height:44px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--bg);cursor:pointer">
      </div>
      <div class="btn-group mt-3">
        <button class="btn btn-outline" onclick="closeModal('newChunkModal')">Cancelar</button>
        <button class="btn btn-primary" onclick="submitNewChunk()">Criar</button>
      </div>
    </div>
  </div>

  <!-- MODAL: NEW NODE -->
  <div id="newNodeModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3>Novo Vocábulo</h3>
        <button class="btn-icon" onclick="closeModal('newNodeModal')">✕</button>
      </div>
      <div class="form-group">
        <label class="label" for="newNodeHanzi">Hanzi *</label>
        <input type="text" id="newNodeHanzi" class="input" placeholder="例: 坚持">
      </div>
      <div class="form-group">
        <label class="label" for="newNodePinyin">Pinyin *</label>
        <input type="text" id="newNodePinyin" class="input" placeholder="jiān chí">
      </div>
      <div class="form-group">
        <label class="label" for="newNodeTranslation">Tradução *</label>
        <input type="text" id="newNodeTranslation" class="input" placeholder="Persistir / Manter o foco">
      </div>
      <div class="form-group">
        <label class="label" for="newNodeChunkSelect">Chunk</label>
        <select id="newNodeChunkSelect" class="select"></select>
      </div>
      <div class="form-group">
        <label class="label" for="newNodeParentSelect">Conectar ao pai (opcional)</label>
        <select id="newNodeParentSelect" class="select"></select>
      </div>
      <div class="form-group">
        <label class="label" for="newNodeNotes">Notas</label>
        <textarea id="newNodeNotes" class="textarea" rows="2" placeholder="Uso, nuance cultural..."></textarea>
      </div>
      <div class="btn-group mt-3">
        <button class="btn btn-outline" onclick="closeModal('newNodeModal')">Cancelar</button>
        <button class="btn btn-primary" onclick="submitNewNode()">Salvar</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    // Service Worker registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
