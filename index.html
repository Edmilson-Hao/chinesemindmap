<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="SinoGraph Pro — Mapas mentais de vocabulário mandarim. Você cria cada mapa e cada palavra.">
  <title>SinoGraph Pro</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <header class="app-header">
    <div class="flex items-center gap-2">
      <div class="brand-icon">◈</div>
      <h1>SinoGraph</h1>
    </div>

    <div class="chunk-select-wrap">
      <select id="chunkSelect" onchange="onChunkSelectChange(this.value)" aria-label="Mapa">
        <option value="GLOBAL">🌐 Todos</option>
      </select>
    </div>

    <div class="header-actions">
      <button id="togglePinyinBtn" class="btn-icon" onclick="toggleRecall('pinyin')" title="Pinyin">拼</button>
      <button id="toggleTransBtn" class="btn-icon" onclick="toggleRecall('trans')" title="Tradução">译</button>
      <div style="position:relative">
        <button id="dataMenuBtn" class="btn-icon" onclick="toggleDataMenu()" title="Menu">⋮</button>
        <div id="dataMenu" class="hidden" style="position:absolute;right:0;top:40px;width:190px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:6px;z-index:50;box-shadow:0 12px 32px rgba(0,0,0,0.5)">
          <button class="btn btn-outline btn-sm w-full" style="justify-content:flex-start;margin-bottom:4px" onclick="exportDataJSON()">↓ Exportar</button>
          <label class="btn btn-outline btn-sm w-full" style="justify-content:flex-start;margin-bottom:4px;cursor:pointer">
            ↑ Importar
            <input type="file" accept=".json" onchange="importDataJSON(event)" style="display:none">
          </label>
          <button class="btn btn-outline btn-sm w-full" style="justify-content:flex-start;color:var(--danger);border-color:var(--danger)" onclick="resetToDefaultData()">↺ Limpar tudo</button>
        </div>
      </div>
    </div>
  </header>

  <nav class="tabs-nav">
    <button id="tabGraphBtn" class="tab-btn active" onclick="switchMainTab('graph')">Mapa</button>
    <button id="tabTableBtn" class="tab-btn" onclick="switchMainTab('table')">Lista</button>
  </nav>

  <main class="main-content">

    <div id="graphView" class="view active">
      <div class="graph-layout">
        <div class="graph-workspace" id="graphContainer">
          <div class="graph-toolbar">
            <button class="btn-icon" onclick="zoomGraph(1.25)" title="Zoom +">＋</button>
            <button class="btn-icon" onclick="zoomGraph(0.8)" title="Zoom −">−</button>
            <button class="btn-icon" onclick="resetGraphZoom()" title="Centralizar">⊙</button>
            <button class="btn-icon" style="background:var(--accent);color:#0f172a;border-color:var(--accent)" onclick="openNewNodeModal()" title="Nova palavra">＋</button>
          </div>

          <div id="graphEmpty" class="graph-empty">
            <div style="font-size:2rem;opacity:0.35;margin-bottom:8px">🗺️</div>
            <p class="text-muted text-sm" style="max-width:220px;line-height:1.4">
              Nenhum mapa ainda.<br>Crie um tema e adicione palavras.
            </p>
            <div class="cta flex gap-2" style="flex-wrap:wrap;justify-content:center">
              <button class="btn btn-primary btn-sm" onclick="openNewChunkModal()">+ Criar tema</button>
              <button class="btn btn-outline btn-sm" onclick="openNewNodeModal()">+ Palavra</button>
            </div>
          </div>

          <svg id="d3GraphSvg"></svg>
        </div>

        <aside class="sidebar" id="nodeDetailSidebar">
          <div class="sidebar-header">
            <span style="font-weight:600;font-size:0.85rem">Estudo</span>
            <span id="sidebarChunkTag" class="badge-muted badge">Nenhum nó</span>
          </div>
          <div id="sidebarBody" class="sidebar-body">
            <div class="empty-state">
              <div class="icon">🗺️</div>
              <p>Crie um tema para começar seu mapa mental.</p>
              <button class="btn btn-primary btn-sm" onclick="openNewChunkModal()">+ Criar tema</button>
            </div>
          </div>
        </aside>
      </div>
    </div>

    <div id="tableView" class="view">
      <div class="table-view-inner">
        <div class="filter-bar">
          <div class="search-wrap">
            <span class="search-icon">⌕</span>
            <input type="search" id="tableSearchInput" class="input" placeholder="Buscar..." oninput="renderTable()">
          </div>
          <div class="filter-actions">
            <select id="tableChunkFilter" class="select" onchange="renderTable()">
              <option value="ALL">Todos</option>
            </select>
            <button class="btn btn-primary btn-sm" onclick="openNewChunkModal()">+ Tema</button>
            <button class="btn btn-outline btn-sm" onclick="openNewNodeModal()">+ Palavra</button>
          </div>
        </div>

        <div class="vocab-table-wrap">
          <div style="overflow-x:auto">
            <table class="vocab-table">
              <thead>
                <tr>
                  <th>Hanzi</th>
                  <th>Pinyin</th>
                  <th>Tradução</th>
                  <th>Mapa</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="vocabTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

  </main>

  <div id="toastContainer" class="toast-container"></div>

  <div id="newChunkModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3>Novo mapa mental</h3>
        <button class="btn-icon" onclick="closeModal('newChunkModal')">✕</button>
      </div>
      <div class="form-group">
        <label class="label" for="newChunkName">Nome do tema</label>
        <input type="text" id="newChunkName" class="input" placeholder="ex: 力量举 - Powerlifting">
      </div>
      <div class="form-group">
        <label class="label" for="newChunkColor">Cor</label>
        <input type="color" id="newChunkColor" value="#f59e0b" style="width:100%;height:44px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--bg);cursor:pointer">
      </div>
      <div class="btn-group mt-3">
        <button class="btn btn-outline" onclick="closeModal('newChunkModal')">Cancelar</button>
        <button class="btn btn-primary" onclick="submitNewChunk()">Criar</button>
      </div>
    </div>
  </div>

  <div id="newNodeModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3>Nova palavra</h3>
        <button class="btn-icon" onclick="closeModal('newNodeModal')">✕</button>
      </div>
      <div class="form-group">
        <label class="label" for="newNodeHanzi">Hanzi *</label>
        <input type="text" id="newNodeHanzi" class="input" placeholder="例: 深蹲" autocomplete="off">
      </div>
      <div class="form-group">
        <label class="label" for="newNodePinyin">Pinyin *</label>
        <input type="text" id="newNodePinyin" class="input" placeholder="shēn dūn" autocomplete="off">
      </div>
      <div class="form-group">
        <label class="label" for="newNodeTranslation">Tradução *</label>
        <input type="text" id="newNodeTranslation" class="input" placeholder="Agachamento (Squat)" autocomplete="off">
      </div>
      <div class="form-group">
        <label class="label" for="newNodeChunkSelect">Mapa / tema</label>
        <select id="newNodeChunkSelect" class="select"></select>
      </div>
      <div class="form-group">
        <label class="label" for="newNodeParentSelect">Ligar a (pai)</label>
        <select id="newNodeParentSelect" class="select">
          <option value="">Sem pai (raiz)</option>
        </select>
      </div>
      <div class="form-group">
        <label class="label" for="newNodeNotes">Notas (opcional)</label>
        <textarea id="newNodeNotes" class="textarea" rows="2" placeholder="Uso, nuance..."></textarea>
      </div>
      <div class="btn-group mt-3">
        <button class="btn btn-outline" onclick="closeModal('newNodeModal')">Cancelar</button>
        <button class="btn btn-primary" onclick="submitNewNode()">Salvar</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
